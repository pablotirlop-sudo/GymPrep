<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymPrep">
<meta name="theme-color" content="#0C0C0A">
<title>GymPrep</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0C0C0A; --sf:#15150F; --sf2:#1D1D15; --ln:#282820; --ln2:#35352A;
  --tx:#F1F0E4; --mut:#91907F; --mut2:#5E5D50;
  --volt:#CDF54A; --voltdim:rgba(205,245,74,.12); --voltln:rgba(205,245,74,.35);
  --red:#FF5D49; --reddim:rgba(255,93,73,.1);
}
html{color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.45;overflow:hidden}
button{font-family:inherit}
#app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;position:relative;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(100px + env(safe-area-inset-bottom))}
#view.enter{animation:fadeUp .28s cubic-bezier(.3,.8,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{opacity:.2}}
@keyframes popin{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}

.h-display{font-stretch:116%;font-weight:860;text-transform:uppercase;letter-spacing:-.015em;line-height:.96}
.tnum{font-feature-settings:'tnum';font-variant-numeric:tabular-nums}
.lab{font-size:10.5px;font-weight:760;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.brand{color:var(--volt);letter-spacing:.3em;font-size:9.5px}
.mut{color:var(--mut)} .small{font-size:12px}
i{font-style:normal}

.top{display:flex;justify-content:space-between;align-items:flex-end;padding:20px 0 8px}
.top h1{font-size:38px}
.dateline{color:var(--mut);font-weight:650;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.slab{display:flex;align-items:center;gap:10px;margin:24px 0 10px}
.slab span{font-size:10.5px;font-weight:760;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.slab i{flex:1;height:7px;background:repeating-linear-gradient(90deg,var(--ln) 0 1px,transparent 1px 7px)}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center} .between{justify-content:space-between}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;border:1px solid var(--ln2);background:var(--sf2);color:var(--tx);font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.volt{background:var(--volt);border-color:var(--volt);color:#111107}
.btn.ghost{background:transparent}
.btn.sm{padding:10px 16px;width:auto;font-size:11px}
.btn.danger{color:var(--red);border-color:rgba(255,93,73,.4)}
.btn.armed{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
.btn .ic{width:16px;height:16px}

.iconbtn{width:36px;height:36px;flex:none;border-radius:11px;border:1px solid var(--ln2);background:var(--sf2);color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.iconbtn:active{transform:scale(.92)}
.iconbtn.big{width:42px;height:42px;border-radius:13px}
.iconbtn.armed{background:var(--red);border-color:var(--red);color:#fff}
.iconbtn .ic{width:17px;height:17px}
.iconbtn.sm2{width:30px;height:30px;border-radius:9px} .iconbtn.sm2 .ic{width:14px;height:14px}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--ln2);background:none;color:var(--mut);font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;flex:none;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--volt);border-color:var(--volt);color:#111107}
.chip.mini{padding:3px 9px;font-size:9px;pointer-events:none}

.field{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--ln2);background:var(--sf2);color:var(--tx);font-family:inherit;font-size:16px;font-weight:600;outline:none;appearance:none;-webkit-appearance:none}
.field:focus{border-color:var(--volt)}
.field.bad{border-color:var(--red)}
textarea.field{min-height:120px;resize:vertical;font-size:13px}
input[type=date]{color-scheme:dark}
input[type=number]::-webkit-inner-spin-button{display:none}
input[type=number]::-webkit-outer-spin-button{display:none}
.err{color:var(--red);font-size:12.5px;font-weight:700;margin-top:12px}

.searchbox{display:flex;align-items:center;gap:9px;padding:0 14px;border:1px solid var(--ln2);background:var(--sf2);border-radius:12px;margin:8px 0 4px}
.searchbox .ic{width:16px;height:16px;color:var(--mut);flex:none}
.searchbox input{flex:1;background:none;border:0;outline:none;color:var(--tx);font-family:inherit;font-size:16px;font-weight:600;padding:12px 0}

.empty{padding:44px 20px;text-align:center;color:var(--mut)}
.empty .ic{width:34px;height:34px;margin:0 auto 12px;opacity:.45}
.empty p{font-size:13.5px;margin-bottom:14px}
.banner{display:flex;gap:12px;align-items:center;background:var(--voltdim);border:1px solid var(--voltln);border-radius:14px;padding:13px 14px;margin:12px 0;font-size:13px}
.banner.red{background:var(--reddim);border-color:rgba(255,93,73,.4)}
.banner .ic{color:var(--volt);flex:none;width:18px;height:18px}
.banner.red .ic{color:var(--red)}
.banner .btn{margin-left:auto;width:auto;flex:none}

.stepper{display:flex;align-items:center;background:var(--sf2);border:1px solid var(--ln2);border-radius:11px;overflow:hidden}
.stepper button{width:32px;height:40px;background:none;border:0;color:var(--mut);font-size:18px;font-weight:700;cursor:pointer}
.stepper input{width:52px;height:40px;background:none;border:0;color:var(--tx);text-align:center;font-family:inherit;font-size:16px;font-weight:800;outline:none}
.stepper.sm button{width:28px;height:34px} .stepper.sm input{width:40px;height:34px;font-size:14px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:13px 14px}
.stat b{display:block;font-size:21px;font-weight:860;font-stretch:112%;letter-spacing:-.01em;line-height:1.1}
.stat b i{font-size:11px;color:var(--mut);font-weight:700;margin-left:3px}
.stat span{font-size:9.5px;font-weight:740;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}

#tabbar{flex:none;display:flex;background:rgba(14,14,11,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--ln);padding:8px 4px calc(10px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--mut2);font-size:8.5px;font-weight:760;letter-spacing:.14em;cursor:pointer;padding:4px 0}
.tab .ic{width:21px;height:21px}
.tab.on{color:var(--volt)}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--volt);display:none}
.tab .livedot.on{display:block}

#modal-root{position:fixed;inset:0;z-index:50;display:none}
#modal-root.on{display:block}
.ovl{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;transition:opacity .25s}
#modal-root.on .ovl{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--sf);border:1px solid var(--ln2);border-bottom:0;border-radius:22px 22px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.3,.9,.3,1);max-height:84dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#modal-root.on .sheet{transform:none}
.grabber{width:40px;height:4px;border-radius:2px;background:var(--ln2);margin:0 auto 14px}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheethead h3{font-size:19px;font-weight:830;font-stretch:110%;text-transform:uppercase;letter-spacing:.02em}
.sheet .lab{display:block;margin:14px 0 8px}
.sheet .btn{margin-top:18px}
.dex{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--ln);font-size:13.5px;font-weight:650}
.dex em{color:var(--mut);font-weight:600;text-align:right}
.dex:last-of-type{border-bottom:0}
.durbig{font-size:42px;font-weight:900;font-stretch:120%;line-height:1;margin:6px 0 4px}
.durbig i{font-size:15px;color:var(--mut);font-weight:700}

#toast-root{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:center;z-index:70;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:#22221B;border:1px solid var(--ln2);color:var(--tx);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:650;opacity:0;transform:translateY(-12px);transition:all .28s;box-shadow:0 10px 34px rgba(0,0,0,.55);max-width:86%}
.toast.on{opacity:1;transform:none}
.toast .ic{width:15px;height:15px;color:var(--volt);flex:none}

.chart{width:100%;display:block}
.chart text{fill:var(--mut);font-family:'Archivo';font-size:9.5px;font-weight:650;letter-spacing:.06em}
.chart .grid{stroke:var(--ln);stroke-width:1}
.chart .line{stroke:var(--volt);stroke-width:2.5;fill:none;stroke-linecap:round}
.chart .line.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s .1s cubic-bezier(.5,0,.2,1) forwards}
.chart .area{fill:var(--voltdim)}
.chart .dot{fill:var(--volt)}
.chart .dot-last{fill:var(--bg);stroke:var(--volt);stroke-width:2.5}
.ringbox{position:relative;display:grid;place-items:center;flex:none}
.ringbox svg{position:absolute;inset:0;width:100%;height:100%}
.rbg{fill:none;stroke:var(--sf2)}
.rfg{fill:none;stroke:var(--volt);transition:stroke-dashoffset .7s cubic-bezier(.3,.8,.3,1)}
.rtxt{position:relative;text-align:center}
.rtxt b{display:block;font-size:20px;font-weight:870;font-stretch:114%}
.rtxt i{display:block;font-size:8px;font-weight:740;letter-spacing:.14em;color:var(--mut);margin-top:2px}

.timer-card{border-color:var(--voltln);background:var(--voltdim);animation:popin .3s}
.recline{display:flex;align-items:center;gap:7px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--volt);animation:pulse 1.3s infinite}
.clock{font-size:56px;font-weight:900;font-stretch:120%;line-height:1;margin:8px 0 4px}
.timesub{color:var(--mut);font-size:12px;font-weight:650;margin-bottom:14px}
.gchipline{margin:4px 0 12px}
.gchipline .lab{display:block;margin-bottom:8px}
.entry{animation:popin .25s}
.ehead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ename{font-size:16.5px;font-weight:780;margin-bottom:5px}
.setrow{display:flex;align-items:center;gap:11px;padding:8px 2px;border-bottom:1px dashed var(--ln);font-size:14px;font-weight:700}
.setrow .setn{width:21px;height:21px;flex:none;border-radius:6px;background:var(--sf2);border:1px solid var(--ln2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mut)}
.setrow .del{margin-left:auto;width:26px;height:26px;border-radius:8px;border:0;background:none;color:var(--mut2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.setrow .del .ic{width:14px;height:14px}
.setrow .del:active{color:var(--red)}
.newset{display:flex;gap:8px;align-items:center;margin-top:12px}
.voltbtn{width:46px;height:42px;flex:none;border-radius:11px;background:var(--volt);border:0;color:#111107;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.voltbtn:active{transform:scale(.9)}
.lasthint{font-size:11px;color:var(--mut2);margin-top:8px;font-weight:600}
.addex{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;border:1px dashed var(--ln2);background:none;color:var(--volt);font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin:4px 0 8px}
.addex:active{background:var(--voltdim)}
.hero{display:flex;gap:18px;align-items:center;padding:20px 16px}
.hero .txt{flex:1}
.hero p.big{font-size:17px;font-weight:760;margin:4px 0 2px}
.hero p.mut{font-size:13px}
.srow{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--ln);cursor:pointer}
.srow .d{width:46px;flex:none;text-align:center}
.srow .d b{display:block;font-size:20px;font-weight:870;font-stretch:115%;line-height:1}
.srow .d span{font-size:8.5px;letter-spacing:.14em;color:var(--mut);font-weight:740}
.srow .ti{font-weight:740;font-size:14px}
.srow .ti i{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-top:2px}
.srow .meta{margin-left:auto;text-align:right;font-size:11px;color:var(--mut);font-weight:650;line-height:1.5}
.sumc{border-color:var(--voltln);background:var(--voltdim);animation:popin .35s}
.sumdone{font-size:34px;color:var(--volt);margin:6px 0 14px}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.sumgrid div{text-align:center}
.sumgrid b{display:block;font-size:19px;font-weight:870;font-stretch:112%}
.sumgrid b i{font-size:9px;color:var(--mut);margin-left:2px}
.sumgrid span{font-size:8px;font-weight:750;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.prline{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--volt);font-weight:650;margin-bottom:12px}
.prline .ic{width:15px;height:15px;flex:none;margin-top:1px}

.exrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--ln);cursor:pointer}
.exrow .en{font-weight:760;font-size:15px}
.exrow .es{font-size:11.5px;color:var(--mut);margin-top:2px}
.exrow .go{margin-left:auto;color:var(--mut2);width:16px;height:16px;flex:none}
.picknote{font-size:11.5px;color:var(--mut);font-weight:600;margin:8px 0 2px}

.vcounts{display:flex;gap:14px;font-size:11.5px;color:var(--mut);font-weight:650;margin:4px 0 12px;flex-wrap:wrap}
.vcounts b{font-weight:800}
.dotc{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.verdict{padding:20px 18px 18px;border-radius:16px;border:1px solid var(--ln);background:var(--sf);margin:14px 0 12px}
.verdict .vword{font-size:clamp(28px,8.5vw,38px);display:flex;align-items:center;gap:12px}
.verdict .vword .ic{width:26px;height:26px;flex:none}
.verdict.up{border-color:var(--voltln);background:var(--voltdim)} .verdict.up .vword{color:var(--volt)}
.verdict.down{border-color:rgba(255,93,73,.35);background:var(--reddim)} .verdict.down .vword{color:var(--red)}
.verdict.flat .vword{color:var(--mut)}
.vsub{color:var(--mut);font-size:12.5px;font-weight:600;margin-top:8px}
.sugbig{font-size:44px;font-weight:900;font-stretch:120%;line-height:1;margin:10px 0 4px}
.sugbig i{font-size:15px;color:var(--mut);font-weight:700}
.notanote{font-size:11px;color:var(--mut2);margin-top:10px}

.goalcard{display:flex;gap:18px;align-items:center}
.goalcard p.big{font-size:16.5px;font-weight:770;margin:3px 0 2px}
.goalcard p.mut{font-size:12.5px}
.streakline{display:flex;align-items:center;gap:6px;color:var(--volt);font-size:12px;font-weight:700;margin-top:7px}
.streakline .ic{width:14px;height:14px}
.mnhead{display:flex;align-items:center;justify-content:space-between;margin:18px 0 2px}
.mtitle{font-size:21px}
.msub{color:var(--mut);font-size:11.5px;font-weight:650;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calh{text-align:center;font-size:9px;font-weight:760;letter-spacing:.1em;color:var(--mut2);padding-bottom:4px;text-transform:uppercase}
.cd{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:12px;border:1px solid transparent;font-weight:750;font-size:14px;cursor:pointer}
.cd .min{font-size:8px;color:rgba(12,12,10,.78);font-weight:800;letter-spacing:.02em}
.cd.done{background:var(--volt);color:#111107}
.cd.today{border-color:var(--ln2)}
.cd.done.today{outline:1.5px solid var(--volt);outline-offset:2px;border-color:transparent}
.cd.dim{color:var(--mut)}
.cd.off{opacity:.28}
.cleg{display:flex;gap:16px;margin-top:14px;font-size:10.5px;color:var(--mut);font-weight:650}
.cleg span{display:flex;align-items:center;gap:6px}
.legdot{width:11px;height:11px;border-radius:4px;display:inline-block}

.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--ln)}
.prow:last-child{border-bottom:0;padding-bottom:2px}
.pval{font-size:23px;font-weight:870;font-stretch:114%;margin-top:3px}
.pval i{font-size:12px;color:var(--mut);font-weight:700}
.delta{font-size:11px;font-weight:700;margin-top:3px;color:var(--mut)}
.delta.good{color:var(--volt)}
.bmirow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-top:13px;border-top:1px solid var(--ln);margin-top:12px}
.bmirow b{font-size:24px;font-weight:880;font-stretch:114%}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:4px 10px;border-radius:99px;background:var(--sf2);border:1px solid var(--ln2);color:var(--mut)}
.tag.up{background:var(--voltdim);border-color:var(--voltln);color:var(--volt)}
.tag.down{background:var(--reddim);border-color:rgba(255,93,73,.35);color:var(--red)}
.inst ol{margin:10px 0 8px 18px;font-size:13.5px}
.inst li{margin-bottom:5px}
.datalist .btn{margin-bottom:8px}
.foot{color:var(--mut2);font-size:10.5px;text-align:center;padding:22px 0 6px;letter-spacing:.08em;font-weight:650;text-transform:uppercase}
.storeok{color:var(--volt)} .storebad{color:var(--red)}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabbar"></nav>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ================= ICONOS ================= */
const ICONS={
  bolt:'<path d="M13 2 4.6 13.2h5L8.6 22l8.8-11.7h-5.2L13 2z" fill="currentColor" stroke="none"/>',
  dumbbell:'<path d="M6.6 5.5v13M17.4 5.5v13M3.2 8.7v6.6M20.8 8.7v6.6M6.6 12h10.8"/>',
  chart:'<path d="M3.5 4.5v15h17"/><path d="M7.5 14.5l3.5-4 3 2.6 5-6.2"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.8h17M8 2.8v4M16 2.8v4"/>',
  user:'<circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2c1.1-3.4 3.9-5.2 7.2-5.2s6.1 1.8 7.2 5.2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  check:'<path d="M4.5 12.5l5 5L19.5 7"/>',
  left:'<path d="M14.5 5.5 8 12l6.5 6.5"/>',
  right:'<path d="M9.5 5.5 16 12l-6.5 6.5"/>',
  trash:'<path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l1 13.2h9l1-13.2M10 11v6M14 11v6"/>',
  timer:'<circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.6 2M9.5 2.5h5"/>',

function weekStreak(){
  let w=startWk(hoy()),n=0;const g=S.profile.goal;
  if(weekCount(w)<g)w=addD(w,-7);
  while(weekCount(w)>=g&&n<52){n++;w=addD(w,-7)}
  return n;
}
function lastSetFor(exId){
  const ss=sortedSessions();
  for(let i=ss.length-1;i>=0;i--){const e=ss[i].entries.find(e=>e.exerciseId===exId&&e.sets.length);
    if(e)return{w:e.sets[e.sets.length-1].w,r:e.sets[e.sets.length-1].r,sets:e.sets}}
  return null;
}
function exSeries(exId){
  const out=[];
  sortedSessions().forEach(s=>s.entries.forEach(e=>{
    if(e.exerciseId===exId&&e.sets.length){
      let maxW=0,vol=0,e1=0;
      e.sets.forEach(t=>{vol+=t.w*t.r;if(t.w>maxW)maxW=t.w;e1=Math.max(e1,t.w*(1+t.r/30))});
      out.push({date:s.date,maxW:r1(maxW),vol:Math.round(vol),e1rm:r1(e1)});
    }
  }));
  return out;
}
function trend(series,key){
  if(series.length<4)return null;
  const v=series.map(p=>p[key]),n=v.length;
  const mx=(n-1)/2,my=v.reduce((a,b)=>a+b,0)/n;
  let numL=0,den=0;
  v.forEach((y,i)=>{numL+=(i-mx)*(y-my);den+=(i-mx)**2});
  const chg=den?(numL/den*(n-1))/Math.abs(my||1)*100:0;
  return{chg,dir:chg>2?1:chg<-2?-1:0};
}

/* ================= GRÁFICO SVG ================= */
function smoothPath(pts){
  if(pts.length<2)return'';
  if(pts.length===2)return`M${pts[0][0]},${pts[0][1]} L${pts[1][0]},${pts[1][1]}`;
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function fmtAx(v){v=r1(v);if(v>=1000)return`${(v/1000).toFixed(1).replace('.',',').replace(',0','')}k`;return String(v).replace('.',',')}
function lineChart(vals,labels,h=185){
  if(!vals.length)return'';
  const W=340,H=h,pl=40,pr=12,pt=16,pb=24;
  let min=Math.min(...vals),max=Math.max(...vals);
  if(min===max){min-=1;max+=1}
  const rg=max-min,lo=Math.max(0,min-rg*.2),hi=max+rg*.2;
  const X=i=>vals.length===1?pl+(W-pl-pr)/2:pl+(W-pl-pr)*i/(vals.length-1);
  const Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const pts=vals.map((v,i)=>[+X(i).toFixed(1),+Y(v).toFixed(1)]);
  const d=smoothPath(pts),base=H-pb;
  let grid='';
  [0,.5,1].forEach(f=>{const v=lo+(hi-lo)*f,y=Y(v).toFixed(1);
    grid+=`<line class="grid" x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}"/><text x="${pl-7}" y="${+y+3}" text-anchor="end">${fmtAx(v)}</text>`});
  const dots=pts.map((p,i)=>`<circle class="dot${i===pts.length-1?' dot-last':''}" cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}"/>`).join('');
  const body=pts.length>1
    ?`<path class="area" d="${d} L${pts[pts.length-1][0]},${base} L${pts[0][0]},${base} Z"/><path class="line draw" pathLength="1" d="${d}"/>`
    :`<circle class="dot" cx="${pts[0][0]}" cy="${pts[0][1]}" r="6"/>`;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${body}${dots}
    <text x="${pl}" y="${H-7}">${labels[0]||''}</text>
    <text x="${W-pr}" y="${H-7}" text-anchor="end">${labels[labels.length-1]||''}</text></svg>`;
}
function ring(pct,size,sw,label,sub){
  const r=(size-sw)/2-2,c=2*Math.PI*r,off=c*(1-clamp(pct,0,1));
  return`<div class="ringbox" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 ${size} ${size}"><circle class="rbg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}"/>
    <circle class="rfg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/></svg>
    <div class="rtxt"><b class="tnum">${label}</b>${sub?`<i>${sub}</i>`:''}</div></div>`;
}

      <button class="btn ghost" data-act="newPastSession">${icon('calendar')} REGISTRAR ENTRENO PASADO</button>`;
  }
  const hist=sortedSessions().slice(-6).reverse();
  if(hist.length){
    html+=`<div class="slab"><span>Últimas sesiones</span><i></i></div>`+hist.map(s=>{
      const dd=pIso(s.date),nsets=s.entries.reduce((a,e)=>a+e.sets.length,0);
      const mus=sessionMuscles(s);
      return`<div class="srow" data-act="openDay" data-d="${s.date}">
        <div class="d tnum"><b>${dd.getDate()}</b><span>${MES[dd.getMonth()]}</span></div>
        <div class="ti">${mus.length?mus.map(m=>MUSCLES[m]||m).join(' · '):'Entreno'}<i>${s.entries.length?esc(s.entries[0].name)+(s.entries.length>1?` +${s.entries.length-1}`:'')+' · ':''}${s.durationMin} min</i></div>
        <div class="meta tnum">${nsets} series<br>${fmtInt(sessionVol(s))} kg vol.</div></div>`;
    }).join('');
  }
  return html;
}

/* ================= VISTA: PROGRESO ================= */
function progIds(){const m={};S.sessions.forEach(s=>s.entries.forEach(e=>{if(e.sets.length)m[e.exerciseId]=e.name}));return m}
function sugHTML(ex){
  const bw=lastBW();
  if(!bw)return`<div class="card"><div class="lab" style="margin-bottom:8px">PESO SUGERIDO</div><p class="mut small" style="margin-bottom:14px">Registra tu peso corporal para calcular el peso óptimo según tu constitución.</p><button class="btn sm volt" data-act="registerWeight">AÑADIR PESO CORPORAL</button></div>`;
  const repsChips=[5,8,10,12].map(r=>`<button class="chip ${r===progReps?'on':''}" data-act="setReps" data-r="${r}">${r} reps</button>`).join('');
  const lvl=LEVELS[ex.level]||1,pct=(PCT[ex.muscle]||.5)*lvl;

    <div class="chips" style="margin-top:10px">${repsChips}</div>

    <p class="notanote">Orientativo: ajusta el nivel del ejercicio en la biblioteca si te quedas corto o largo.</p></div>`;
}
function vProg(){

      <div class="empty">${icon('chart')}<p>Aún no hay datos. Registra tu primera sesión en la pestaña Hoy y aquí aparecerán tus gráficos, tu veredicto y tus pesos sugeridos.</p><button class="btn sm volt" data-act="nav" data-tab="today">IR A ENTRENAR</button></div>`;
  if(!progEx||!ids[progEx])progEx=Object.keys(ids)[0];
  const raw=S.exercises.find(x=>x.id===progEx);
  const ex=raw||{id:progEx,name:ids[progEx],muscle:null,level:'intermedio'};
  const series=exSeries(progEx).slice(-10);
  const t=trend(series,progMetric);
  let up=0,flat=0,down=0;
  Object.keys(ids).forEach(id=>{const tt=trend(exSeries(id).slice(-10),progMetric);if(tt){tt.dir===1?up++:tt.dir===-1?down++:flat++}});
  const vals=series.map(p=>p[progMetric]);
  const labels=series.map(p=>{const d=pIso(p.date);return`${d.getDate()}/${d.getMonth()+1}`});

  const ic=t?(t.dir===1?'arrowup':t.dir===-1?'arrowdown':'dash'):'info';
  const chg=t?`${t.chg>=0?'+':''}${fmtKG(t.chg)}%`:'';

  const last=series[series.length-1];
  const stats=`<div class="grid2">
    <div class="stat"><b class="tnum">${vals.length?fmtKG(Math.max(...vals)):''}</b><span>Récord</span></div>
    <div class="stat"><b class="tnum">${last?fmtKG(last[progMetric]):''}</b><span>Última sesión</span></div>
    <div class="stat"><b class="tnum">${series.length?fmtInt(series.reduce((a,p)=>a+p.vol,0)/series.length):''}<i>kg</i></b><span>Vol. medio</span></div>
    <div class="stat"><b class="tnum">${series.length}</b><span>Sesiones</span></div></div>`;
  return`<div class="top"><div><div class="lab brand">GYMPREP</div><h1 class="h-display">Progreso</h1></div></div>
    <div class="vcounts"><span><b class="dotc" style="background:var(--volt)"></b><b>${up}</b> mejorando</span>
    <span><b class="dotc" style="background:var(--mut)"></b><b>${flat}</b> estables</span>

    <div class="verdict ${t?(t.dir===1?'up':t.dir===-1?'down':'flat'):'flat'}">
      <div class="vword h-display">${word} ${icon(ic)}</div>
      <div class="vsub">${t?`${chg} de tendencia en tus últimas ${series.length} sesiones (${METRICS[progMetric].toLowerCase()})`:'Registra al menos 4 sesiones de este ejercicio para analizar tu tendencia.'}</div></div>

    ${sugHTML(ex)}`;
}

/* ================= VISTA: CALENDARIO ================= */
function sessionsOn(dis){return S.sessions.filter(s=>s.date===dis)}

  const st=startWk(hoy()),wc=weekCount(st),goal=S.profile.goal,strk=weekStreak();
  const y=calCur.getFullYear(),m=calCur.getMonth();
  const off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  const mSes=S.sessions.filter(s=>{const d=pIso(s.date);return d.getFullYear()===y&&d.getMonth()===m});
  const mMin=mSes.reduce((a,s)=>a+s.durationMin,0);
  let cells=DOWL.map(d=>`<div class="calh">${d}</div>`).join('');
  for(let i=0;i<off;i++)cells+='<div></div>';
  for(let d=1;d<=dim;d++){
    const dt=new Date(y,m,d),dis=iso(dt),ses=sessionsOn(dis);
    const fut=dt>hoy(),min=ses.reduce((a,s)=>a+s.durationMin,0);
    const cls=ses.length?'done':iso(hoy())===dis?'today':fut?'off':'dim';
    cells+=`<div class="cd tnum ${cls}" data-act="openDay" data-d="${dis}"><span>${d}</span>${ses.length?`<span class="min">${min}m</span>`:''}</div>`;
  }
  return`<div class="top"><div><div class="lab brand">GYMPREP</div><h1 class="h-display">Agenda</h1></div>
    <button class="iconbtn big" data-act="newPastSession">${icon('plus')}</button></div>
    <div class="card goalcard">${ring(goal?wc/goal:0,104,9,`${wc}/${goal}`,'SEMANA')}

    <p class="big">${wc>=goal?'Meta cumplida':'En camino'}</p>
    <p class="mut">${wc>=goal?`${wc} entrenos esta semana.`:`Te faltan ${goal-wc} de ${goal}.`}</p>

    <div class="mnhead"><button class="iconbtn" data-act="prevMonth">${icon('left')}</button><div class="mtitle h-display tnum">${MES[m]} ${y}</div><button class="iconbtn" data-act="nextMonth">${icon('right')}</button></div>
    <div class="msub tnum">${mSes.length} ${mSes.length===1?'sesión':'sesiones'} · ${fmtInt(mMin)} min este mes</div>
    <div class="cal">${cells}</div>
    <div class="cleg"><span><i class="legdot" style="background:var(--volt)"></i>Entreno</span><span><i class="legdot" style="border:1.5px solid var(--ln2)"></i>Hoy</span><span><i class="legdot" style="background:var(--sf2);opacity:.4"></i>Próximos días</span></div>`;

function openDay(dis){

      return`<div class="card"><div class="row between"><div class="lab">Sesión</div><button class="iconbtn sm2" data-act="editDur" data-sid="${s.id}" data-d="${dis}">${icon('edit')}</button></div>
        ${mus.length?`<div class="chips" style="margin:10px 0 4px">${mus.map(m=>`<span class="chip mini">${MUSCLES[m]||m}</span>`).join('')}</div>`:''}
        <div class="durbig tnum">${s.durationMin}<i> min</i></div>
        <div class="grid2" style="margin:12px 0"><div class="stat" style="padding:10px 12px"><b class="tnum">${fmtInt(sessionVol(s))}</b><span>Volumen kg</span></div>

    }).join('');
    if(d<=hoy())body+=`<button class="btn ghost" data-act="newPastSession" data-d="${dis}">${icon('plus')} AÑADIR OTRA SESIÓN</button>`;

/* ================= ROUTER ================= */
const VIEWS={today:vToday,ex:vEx,prog:vProg,cal:vCal,me:vMe};
function render(keepScroll=false){
  const v=$('#view'),sc=v.scrollTop;
  v.classList.remove('enter');void v.offsetWidth;
  v.innerHTML=VIEWS[TAB]();
  v.classList.add('enter');
  v.scrollTop=keepScroll?sc:0;
  $('#tabbar').innerHTML=TABS.map(t=>`<button class="tab ${TAB===t[0]?'on':''}" data-act="nav" data-tab="${t[0]}">${icon(t[1])}${t[2]}<span class="livedot ${editTarget()&&t[0]==='today'?'on':''}"></span></button>`).join('');
}

/* ================= MODAL NUEVA SESIÓN (grupos primero) ================= */
function modalChipsHTML(){
  return ORDER.map(m=>`<button class="chip ${modalMuscles.includes(m)?'on':''}" data-act="tglModalMuscle" data-g="${m}">${MUSCLES[m]}</button>`).join('');
}
function newSessionModal(kind,presetDate){
  modalMuscles=[];modalMusclesCtx=kind;
  const past=kind==='past';
  openModal(`<div class="grabber"></div><div class="sheethead"><h3>${past?'Entreno pasado':'Nuevo entreno'}</h3><button class="iconbtn" data-act="closeModal">${icon('x')}</button></div>
    <p class="mut small" style="margin-top:-4px">¿Qué ${past?'entrenaste ese día':'vas a entrenar hoy'}? Elige los grupos y después te dejaré meter sus ejercicios.</p>
    <label class="lab">Grupos musculares</label><div class="chips" id="mchips">${modalChipsHTML()}</div>
    ${past?`<label class="lab">Fecha</label><input type="date" class="field tnum" id="pd" value="${presetDate||iso(hoy())}" max="${iso(hoy())}">
    <label class="lab">Duración (minutos)</label><input type="number" inputmode="numeric" class="field tnum" id="pmin" placeholder="60">`:''}

/* ================= ACCIONES ================= */
const ACTIONS={
  nav(t){lastSummary=null;TAB=t.dataset.tab;render()},
  closeModal(){closeModal()},
  startSession(){newSessionModal('live')},
  newPastSession(t){newSessionModal('past',t.dataset.d)},
  tglModalMuscle(t){
    const g=t.dataset.g,i=modalMuscles.indexOf(g);
    i>=0?modalMuscles.splice(i,1):modalMuscles.push(g);
    const el=$('#mchips');if(el)el.innerHTML=modalChipsHTML();
  },
  confirmNewSession(){
    if(!modalMuscles.length){sheetErr('Elige al menos un grupo muscular.');return}
    if(modalMusclesCtx==='past'){
      const d=$('#pd').value,min=Math.round(num($('#pmin').value));
      if(!d){sheetErr('Elige una fecha.');return}
      if(!(min>0)){sheetErr('Introduce la duración en minutos.');flag($('#pmin'));return}
      const s={id:uid(),date:d,durationMin:min,muscles:[...modalMuscles],entries:[]};
      S.sessions.push(s);S.pastEdit=s.id;
      save();closeModal();TAB='today';render();toast('Sesión creada: añade tus ejercicios','check');
    }else{
      S.active={startedAt:Date.now(),muscles:[...modalMuscles],entries:[]};
      lastSummary=null;
      save();closeModal();render();toast('Entrenamiento iniciado','bolt');
    }
  },
  tglSMuscle(t){
    const g=t.dataset.g,ctx=editTarget();if(!ctx)return;
    const s=ctx.s,i=s.muscles.indexOf(g);
    if(i>=0){
      const n=s.entries.filter(e=>e.muscle===g).length;
      if(n>0){
        openModal(`<div class="grabber"></div><div class="sheethead"><h3>Quitar ${MUSCLES[g]}</h3><button class="iconbtn" data-act="closeModal">${icon('x')}</button></div>
          <p class="mut small">Esta sesión tiene <b>${n} ${n===1?'ejercicio':'ejercicios'}</b> de ${MUSCLES[g]} con sus series.</p>
          <button class="btn volt" data-act="muscleKeep" data-g="${g}">MANTENER EJERCICIOS</button>
          <button class="btn ghost danger" data-act="musclePurge" data-g="${g}">${icon('trash')} QUITAR GRUPO Y EJERCICIOS</button>`);
        return;
      }
      s.muscles.splice(i,1);
    }else s.muscles.push(g);
    save();render(true);
  },
  muscleKeep(t){
    const ctx=editTarget(),g=t.dataset.g;if(!ctx)return;
    ctx.s.muscles=ctx.s.muscles.filter(x=>x!==g);
    save();closeModal();render(true);
  },
  musclePurge(t){
    const ctx=editTarget(),g=t.dataset.g;if(!ctx)return;
    ctx.s.muscles=ctx.s.muscles.filter(x=>x!==g);
    ctx.s.entries=ctx.s.entries.filter(e=>e.muscle!==g);
    save();closeModal();render(true);toast('Grupo y ejercicios eliminados','trash');
  },
  cancelSession(t){if(!arm(t))return;S.active=null;save();render();toast('Sesión descartada','x')},
  finishSession(){
    if(!S.active)return;
    const el=Math.max(1,Math.round((Date.now()-S.active.startedAt)/60000));
    const sets=S.active.entries.reduce((a,e)=>a+e.sets.length,0);
    const vol=Math.round(S.active.entries.reduce((a,e)=>a+e.sets.reduce((x,y)=>x+y.w*y.r,0),0));
    openModal(`<div class="grabber"></div><div class="sheethead"><h3>Finalizar entreno</h3><button class="iconbtn" data-act="closeModal">${icon('x')}</button></div>
      <p class="mut small">¿Cuánto ha durado? Ajusta los minutos si el cronómetro no encaja con tu sesión real.</p>
      <div class="row" style="margin-top:12px"><input type="number" inputmode="numeric" class="field tnum" id="fdur" value="${el}" style="width:110px;text-align:center"><span class="mut" style="font-weight:700">min</span></div>
      <p class="mut small tnum" style="margin-top:10px">${sets} series · ${fmtInt(vol)} kg de volumen</p>
      <button class="btn volt" data-act="confirmFinish">${icon('check')} GUARDAR SESIÓN</button>`);
  },
  confirmFinish(){
    if(!S.active){closeModal();return}
    const dur=Math.round(num($('#fdur').value));
    if(!(dur>0)){sheetErr('Introduce una duración válida en minutos.');flag($('#fdur'));return}
    const entries=S.active.entries.filter(e=>e.sets.length).map(e=>({exerciseId:e.exerciseId,name:e.name,muscle:e.muscle,sets:e.sets}));
    const prev=sortedSessions();
    S.sessions.push({id:uid(),date:iso(hoy()),durationMin:dur,muscles:[...S.active.muscles],entries});
    S.active=null;
    let vol=0,nsets=0;const prs=[];
    entries.forEach(e=>{let best=0;e.sets.forEach(t=>{vol+=t.w*t.r;nsets++;best=Math.max(best,t.w*(1+t.r/30))});
      let pb=0;prev.forEach(s=>s.entries.forEach(p=>{if(p.exerciseId===e.exerciseId)p.sets.forEach(t=>pb=Math.max(pb,t.w*(1+t.r/30)))}));
      if(pb>0&&best>pb*1.005)prs.push(e.name)});
    lastSummary={dur,vol:Math.round(vol),nsets,prs,muscles:entries.map(e=>e.muscle).filter((m,i,a)=>a.indexOf(m)===i)};
    save();closeModal();render();toast('Sesión guardada','check');
  },
  dismissSummary(){lastSummary=null},
  pickExercise(){
    const ctx=editTarget();if(!ctx)return;
    const f=ctx.s.muscles;
    openModal(`<div class="grabber"></div><div class="sheethead"><h3>Añadir ejercicio</h3><button class="iconbtn" data-act="closeModal">${icon('x')}</button></div>
      <div class="searchbox">${icon('search')}<input data-inp="pickQ" placeholder="Buscar ejercicio"></div>
      <p class="picknote">Filtrado por: ${f.length?f.map(m=>MUSCLES[m]).join(' · '):'todos los grupos (no has marcado ninguno)'}</p>
      <div id="picklist">${pickListHTML('')}</div>`);
  },
  chooseEx(t){
    const ctx=editTarget(),ex=S.exercises.find(x=>x.id===t.dataset.id);
    if(!ex||!ctx)return;
    ctx.s.entries.push({exerciseId:ex.id,name:ex.name,muscle:ex.muscle,sets:[]});
    save();closeModal();render(true);
    $('#view').scrollTop=$('#view').scrollHeight;
  },
  addSet(t){
    const ctx=editTarget();if(!ctx)return;
    const card=t.closest('.entry'),ei=+card.dataset.ei;
    const iw=card.querySelector('.in-w'),ir=card.querySelector('.in-r');
    const w=num(iw.value),r=Math.round(num(ir.value));
    if(!(w>0)||!(r>0)){toast('Revisa peso y repeticiones: deben ser números','x');flag(iw);flag(ir);return}
    ctx.s.entries[ei].sets.push({w:r1(w),r});save();render(true);
  },
  delSet(t){
    const ctx=editTarget();if(!ctx)return;
    ctx.s.entries[+t.dataset.ei].sets.splice(+t.dataset.si,1);save();render(true);
  },
  delEntry(t){
    const ctx=editTarget();if(!ctx)return;
    ctx.s.entries.splice(+t.dataset.ei,1);save();render(true);
  },
  stepW(t){const i=t.parentElement.querySelector('input');i.value=r1(clamp((num(i.value)||0)+2.5*(+t.dataset.dir),0,999))},
  stepR(t){const i=t.parentElement.querySelector('input');i.value=clamp((Math.round(num(i.value))||0)+(+t.dataset.dir),1,50)},
  openPastEdit(t){
    if(!S.sessions.find(x=>x.id===t.dataset.sid))return;
    S.pastEdit=t.dataset.sid;save();closeModal();TAB='today';render();
  },
  closePastEdit(){S.pastEdit=null;save();render();toast('Sesión guardada','check')},
  durStep(t){
    const i=$('#pastdur');if(!i)return;
    i.value=clamp((Math.round(num(i.value))||0)+(+t.dataset.dir),1,600);
  },
  savePastDur(){
    const ctx=editTarget();if(!ctx||ctx.kind!=='past')return;
    const v=Math.round(num($('#pastdur').value));
    if(!(v>0)){toast('Duración no válida','x');return}
    ctx.s.durationMin=v;save();render(true);toast('Duración actualizada','check');
  },
  delSessionFromEditor(t){
    if(!arm(t,'¿BORRAR?'))return;
    S.sessions=S.sessions.filter(s=>s.id!==S.pastEdit);
    S.pastEdit=null;save();render();toast('Sesión eliminada','trash');
  },
  openDay(t){const dis=t.dataset.d;if(pIso(dis)>hoy()&&!sessionsOn(dis).length)return;openDay(dis)},
  delSession(t){if(!arm(t,'¿BORRAR?'))return;S.sessions=S.sessions.filter(s=>s.id!==t.dataset.sid);save();closeModal();render();toast('Sesión eliminada','trash')},
  editDur(t){
    const s=S.sessions.find(x=>x.id===t.dataset.sid);
    openModal(`<div class="grabber"></div><div class="sheethead"><h3>Editar duración</h3><button class="iconbtn" data-act="closeModal">${icon('x')}</button></div>
      <input type="number" inputmode="numeric" class="field tnum" id="edur" value="${s.durationMin}">
      <button class="btn volt" data-act="confirmDur" data-sid="${s.id}" data-d="${t.dataset.d}">${icon('check')} GUARDAR</button>`);
  },
  confirmDur(t){
    const s=S.sessions.find(x=>x.id===t.dataset.sid),v=Math.round(num($('#edur').value));
    if(!(v>0)){sheetErr('Duración no válida.');flag($('#edur'));return}
    s.durationMin=v;save();render(true);openDay(t.dataset.d);toast('Duración actualizada','check');
  },
  prevMonth(){calCur=new Date(calCur.getFullYear(),calCur.getMonth()-1,1);render(true)},
  nextMonth(){calCur=new Date(calCur.getFullYear(),calCur.getMonth()+1,1);render(true)},
  addExercise(){modalGroup='pecho';
    openModal(`<div class="grabber"></div><div class="sheethead"><h3>Nuevo ejercicio</h3><button class="iconbtn" data-act="closeModal">${icon('x')}</button></div>
      <input class="field" id="exname" placeholder="Nombre del ejercicio" maxlength="40">
      <label class="lab">Grupo muscular</label><div class="chips" id="gchips">${groupChips('pecho','pickGroup')}</div>
      <button class="btn volt" data-act="confirmAddEx">${icon('check')} GUARDAR</button>`);
  },
  pickGroup(t){modalGroup=t.dataset.g;$('#gchips').innerHTML=groupChips(modalGroup,'pickGroup')},
  confirmAddEx(){
    const n=$('#exname').value.trim();
    if(!n){sheetErr('Escribe un nombre para el ejercicio.');flag($('#exname'));return}
    S.exercises.push({id:uid(),name:n,muscle:modalGroup,level:'intermedio'});
    save();closeModal();render();toast('Ejercicio añadido','check');
  },
  openEx(t){
    const ex=S.exercises.find(x=>x.id===t.dataset.id);if(!ex)return;
    modalGroup=ex.muscle;modalLevel=ex.level||'intermedio';
    const s=exSeries(ex.id);
    const rec=s.length?fmtKG(Math.max(...s.map(p=>p.e1rm)))+' kg de 1RM est.':'sin registros';
    openModal(`<div class="grabber"></div><div class="sheethead"><h3>Editar ejercicio</h3><button class="iconbtn" data-act="closeModal">${icon('x')}</button></div>
      <input class="field" id="exname" value="${esc(ex.name)}" maxlength="40">
      <label class="lab">Grupo muscular</label><div class="chips" id="gchips">${groupChips(modalGroup,'pickGroup')}</div>
      <label class="lab">Tu nivel en este ejercicio</label><div class="chips" id="lchips">${levelChips(modalLevel)}</div>
      <p class="mut small" style="margin-top:8px">El nivel calibra el peso sugerido: se calcula como un porcentaje de tu peso corporal y aquí decides cuán exigente es ese porcentaje.</p>
      <p class="mut small tnum" style="margin-top:10px">Historial: ${s.length} ${s.length===1?'registro':'registros'} · ${rec}</p>
      <button class="btn volt" data-act="saveEx" data-id="${ex.id}">${icon('check')} GUARDAR CAMBIOS</button>
      <button class="btn ghost danger" data-act="deleteEx" data-id="${ex.id}">${icon('trash')} BORRAR EJERCICIO</button>`);
  },
  pickLevel(t){modalLevel=t.dataset.l;$('#lchips').innerHTML=levelChips(modalLevel)},
  saveEx(t){
    const ex=S.exercises.find(x=>x.id===t.dataset.id);
    if(!ex){closeModal();return}
    const n=$('#exname').value.trim();
    if(!n){sheetErr('El nombre no puede estar vacío.');flag($('#exname'));return}
    ex.name=n;ex.muscle=modalGroup;ex.level=modalLevel;
    save();closeModal();render();toast('Cambios guardados','check');
  },
  deleteEx(t){
    if(!arm(t,'¿BORRAR?'))return;
    S.exercises=S.exercises.filter(x=>x.id!==t.dataset.id);
    if(progEx===t.dataset.id)progEx=null;
    save();closeModal();render();toast('Ejercicio eliminado','trash');
  },
  setProgEx(t){progEx=t.dataset.id;render()},
  setMetric(t){progMetric=t.dataset.m;render(true)},
  setReps(t){progReps=+t.dataset.r;render(true)},
  registerWeight(){
    openModal(`<div class="grabber"></div><div class="sheethead"><h3>Registrar peso</h3><button class="iconbtn" data-act="closeModal">${icon('x')}</button></div>
      <label class="lab">Fecha</label><input type="date" class="field tnum" id="wdate" value="${iso(hoy())}" max="${iso(hoy())}">
      <label class="lab">Peso corporal (kg)</label><input type="number" inputmode="decimal" step="0.1" class="field tnum" id="wkg" placeholder="78,4">
      <button class="btn volt" data-act="confirmWeight">${icon('check')} GUARDAR</button>`);
  },
  confirmWeight(){
    const d=$('#wdate').value||iso(hoy()),kg=num($('#wkg').value);
    if(!(kg>20&&kg<400)){sheetErr('Introduce un peso válido en kilogramos (usa coma o punto para los decimales).');flag($('#wkg'));return}
    const w=S.profile.weights.filter(x=>x.d!==d);
    w.push({d,kg:r1(kg)});w.sort((a,b)=>a.d<b.d?-1:1);
    S.profile.weights=w;save();closeModal();render();toast('Peso registrado','check');
  },
  heightStep(t){
    let h=S.profile.height??170;
    S.profile.height=clamp(h+(+t.dataset.dir),120,230);save();render(true);
  },
  goalStep(t){S.profile.goal=clamp(S.profile.goal+(+t.dataset.dir),1,7);save();render(true)},
  exportData(){
    openModal(`<div class="grabber"></div><div class="sheethead"><h3>Exportar datos</h3><button class="iconbtn" data-act="closeModal">${icon('x')}</button></div>
      <p class="mut small">Copia este texto y guárdalo donde quieras (Notas, un correo a ti mismo…). Podrás restaurarlo con «Importar datos».</p>
      <textarea class="field ta" readonly id="expj">${esc(JSON.stringify(S))}</textarea>
      <button class="btn volt" data-act="doCopy">${icon('share')} COPIAR</button>`);
  },
  doCopy(){
    const ta=$('#expj');ta.select();ta.setSelectionRange(0,999999);
    const ok=()=>toast('Copiado al portapapeles');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(ok).catch(()=>{document.execCommand('copy');ok()});
    }else{document.execCommand('copy');ok()}
  },
  importData(){
    openModal(`<div class="grabber"></div><div class="sheethead"><h3>Importar datos</h3><button class="iconbtn" data-act="closeModal">${icon('x')}</button></div>
      <p class="mut small">Pega aquí la copia de seguridad. Esto sustituirá tus datos actuales.</p>
      <textarea class="field ta" id="impj" placeholder="Pega el JSON…"></textarea>
      <button class="btn volt" data-act="doImport">${icon('dl')} CARGAR DATOS</button>`);
  },
  doImport(t){
    if(!arm(t,'¿SUSTITUIR?'))return;
    try{
      const d=JSON.parse($('#impj').value);
      if(!d.profile||!Array.isArray(d.exercises)||!Array.isArray(d.sessions))throw 0;
      S=d;S.pastEdit=null;save();closeModal();render();toast('Datos importados','check');
    }catch(e){sheetErr('El texto pegado no es una copia de seguridad válida.')}
  },
  wipeData(t){
    if(!arm(t,'¿BORRAR TODO?'))return;
    localStorage.removeItem(KEY);S=blank();progEx=null;lastSummary=null;
    save();closeModal();render();toast('Todo borrado, empezamos de cero','trash');
  }
};

/* ================= PICKER FILTRADO POR GRUPOS ================= */
function pickListHTML(q){
  q=(q||'').toLowerCase();
  const ctx=editTarget(),f=ctx?ctx.s.muscles:[];
  let rows='';
  ORDER.forEach(m=>{
    if(f.length&&!f.includes(m))return;
    const items=S.exercises.filter(x=>x.muscle===m&&(!q||x.name.toLowerCase().includes(q)));
    if(!items.length)return;
    rows+=`<div class="slab"><span>${MUSCLES[m]}</span><i></i></div>`+items.map(x=>`<div class="exrow" data-act="chooseEx" data-id="${x.id}"><div class="en">${esc(x.name)}</div>${icon('plus','go')}</div>`).join('');
  });
  return rows||`<div class="empty">${icon('search')}<p>Sin resultados${f.length?' en los grupos de esta sesión':''}.</p></div>`;
}

/* ================= EVENTOS ================= */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACTIONS[t.dataset.act])ACTIONS[t.dataset.act](t,e)});
const INP={
  exQ(t){exQ=t.value;const l=$('#exlist');if(l)l.innerHTML=exRowsHTML()},
  pickQ(t){const l=$('#picklist');if(l)l.innerHTML=pickListHTML(t.value)}
};
document.addEventListener('input',e=>{const t=e.target.closest('[data-inp]');if(t&&INP[t.dataset.inp])INP[t.dataset.inp](t)});
const CHG={height(t){const v=Math.round(num(t.value));if(v>100&&v<250){S.profile.height=v;save();render(true)}}};
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&CHG[t.dataset.chg])CHG[t.dataset.chg](t)});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const ns=e.target.closest('.newset');
  if(ns){e.preventDefault();const b=ns.querySelector('[data-act="addSet"]');if(b)b.click();return}
  const sh=e.target.closest('.sheet');
  if(sh&&e.target.tagName==='INPUT'){
    const b=sh.querySelector('[data-act="confirmFinish"],[data-act="confirmNewSession"],[data-act="confirmWeight"],[data-act="confirmAddEx"],[data-act="confirmDur"],[data-act="saveEx"],[data-act="doImport"]');
    if(b){e.preventDefault();b.click()}
  }
});
setInterval(()=>{if(S.active&&TAB==='today'){const el=$('#clock');if(el)el.textContent=fmtClock(Date.now()-S.active.startedAt)}},1000);

/* ================= PWA: persistencia y modo offline ================= */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

/* ================= ICONO DE APP (GymPrep) ================= */
(function makeAppIcon(){
  try{
    const SZ=512,c=document.createElement('canvas');c.width=SZ;c.height=SZ;
    const g=c.getContext('2d');
    g.fillStyle='#0C0C0A';g.fillRect(0,0,SZ,SZ);
    const r=96,ix=26,iw=SZ-52;
    g.beginPath();
    g.moveTo(ix+r,ix);
    g.arcTo(ix+iw,ix,ix+iw,ix+iw,r);g.arcTo(ix+iw,ix+iw,ix,ix+iw,r);
    g.arcTo(ix,ix+iw,ix,ix,r);g.arcTo(ix,ix,ix+iw,ix,r);
    g.closePath();
    g.lineWidth=7;g.strokeStyle='rgba(205,245,74,.35)';g.stroke();
    const P=[[13,2],[4.6,13.2],[9.6,13.2],[8.6,22],[17.4,10.3],[12.2,10.3]];
    function bolt(tx,ty,sc,col){
      g.save();g.translate(tx,ty);g.scale(sc,sc);
      g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));
      g.closePath();g.fillStyle=col;g.fill();g.restore();
    }
    bolt(62,44,19,'rgba(205,245,74,.16)');
    bolt(47,28,19,'#CDF54A');
    const url=c.toDataURL('image/png');
    const t=document.createElement('link');t.rel='apple-touch-icon';t.href=url;document.head.appendChild(t);
    const f=document.createElement('link');f.rel='icon';f.href=url;document.head.appendChild(f);
  }catch(e){}
})();

render();
</script>
